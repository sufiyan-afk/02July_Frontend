<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function FindEvenOdd() {
            let num = Number(prompt("enter a number"));

            let n = (num %2 == 0) ? "even":"odd";
            alert("number is : "+n)
        }
    </script>
</head>
<body>
    <button onclick="FindEvenOdd()">FindEvenOdd</button>
</body>
</html>
