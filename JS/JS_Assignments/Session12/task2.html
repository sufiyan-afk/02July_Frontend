<!DOCTYPE html>
<html>
<head>
    <title>Task 2</title>
</head>
<body>

<script>
function fetchTopMovies() {
    fetch("https://jsonplaceholder.typicode.com/albums")
        .then(response => response.json())
        .then(movies => {
            movies.slice(0, 3).forEach(movie => {
                console.log("Trending Movie:", movie.title);
            });
        })
        .catch(error => {
            console.log("Error:", error);
        });
}

fetchTopMovies();
</script>

</body>
</html>
