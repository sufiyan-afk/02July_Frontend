<!DOCTYPE html>
<html>
<head>
    <title>Task 3</title>
</head>
<body>

<input type="text" id="songInput" placeholder="Enter song name">
<button id="addSong">Add Song</button>

<ul id="playlist"></ul>

<script>
    document.querySelector("#addSong").addEventListener("click", function() {
        let songName = document.querySelector("#songInput").value;

        if (songName !== "") {
            let li = document.createElement("li");
            li.innerHTML = songName;

            document.querySelector("#playlist").appendChild(li);

            document.querySelector("#songInput").value = "";
        }
    });
</script>

</body>
</html>
