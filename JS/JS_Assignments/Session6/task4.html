<!DOCTYPE html>
<html>
<head>
    <title>Task 4</title>
</head>
<body>

<input type="text" id="friendInput" placeholder="Enter friend's name">
<button id="addFriend">Add Friend</button>

<ul id="friend-list"></ul>

<script>
    document.querySelector("#addFriend").addEventListener("click", function() {
        let friendName = document.querySelector("#friendInput").value;

        if (friendName !== "") {
            let li = document.createElement("li");
            li.innerHTML = friendName;

            document.querySelector("#friend-list").appendChild(li);

            document.querySelector("#friendInput").value = "";
        }
    });
</script>

</body>
</html>
