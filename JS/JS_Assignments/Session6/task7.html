<!DOCTYPE html>
<html>
<head>
    <title>Task 7</title>
</head>
<body>

<input type="text" id="colorInput" placeholder="Enter color">

<div id="moodbox" style="width: 300px; height: 200px; border: 1px solid black; margin-top: 20px;">
    Mood Box
</div>

<script>
    let colorInput = document.getElementById("colorInput");
    let moodbox = document.getElementById("moodbox");

    colorInput.addEventListener("input", function() {
        moodbox.style.backgroundColor = colorInput.value;
    });
</script>

</body>
</html>
