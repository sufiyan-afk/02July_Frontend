<!DOCTYPE html>
<html>
<head>
    <title>Task 6</title>
</head>
<body>

<button id="addCart">Add to Cart</button>

<div id="cart"></div>

<script>
    function addToCart() {
        let product = document.createElement("p");
        product.innerHTML = "Mobile added to cart";

        document.querySelector("#cart").appendChild(product);
    }

    document.querySelector("#addCart").addEventListener("click", addToCart);
</script>

</body>
</html>
