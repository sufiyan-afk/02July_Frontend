<!DOCTYPE html>
<html>
<head>
    <title>Task 8</title>
</head>
<body>

<div id="mouseBox" style="width:400px; height:200px; border:2px solid black;">
    Click anywhere inside this box
</div>

<p id="coordinates"></p>

<script>
    document.getElementById("mouseBox").addEventListener("click", function(event) {
        document.getElementById("coordinates").innerHTML =
            "X: " + event.clientX + " Y: " + event.clientY;
    });
</script>

</body>
</html>
