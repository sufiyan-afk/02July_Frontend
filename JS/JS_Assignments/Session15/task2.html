<!DOCTYPE html>

<body>

<script>
class Playlist {
    constructor(name, songs) {
        this.name = name;
        this.songs = songs;
    }

    displayPlaylist() {
        console.log(`Playlist: ${this.name}`);
        console.log(`Songs: ${this.songs.join(", ")}`);
    }
}

const playlist = new Playlist("Chill Vibes", [
    "Perfect",
    "Until I Found You",
    "Night Changes"
]);

playlist.displayPlaylist();
</script>

</body>
</html>
