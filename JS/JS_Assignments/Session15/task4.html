<script>
class FlipkartProduct {
    constructor(title, price, rating) {
        this.title = title;
        this.price = price;
        this.rating = rating;
    }

    getDiscountedPrice(discountPercent) {
        return this.price - (this.price * discountPercent / 100);
    }
}

const product = new FlipkartProduct(
    "Redmi Note 12 Pro",
    18999,
    4.5
);

console.log(
    "Discounted Price:",
    product.getDiscountedPrice(10)
);
</script>
