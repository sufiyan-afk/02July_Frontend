<body>

<script>
class FlipkartProduct {
    constructor(title, price, rating) {
        this.title = title;
        this.price = price;
        this.rating = rating;
    }

    showProductInfo() {
        console.log(
            `${this.title} - ₹${this.price} - ${this.rating}⭐`
        );
    }
}

const product = new FlipkartProduct(
    "Redmi Note 12 Pro",
    18999,
    4.5
);

product.showProductInfo();
</script>

</body>
</html>
