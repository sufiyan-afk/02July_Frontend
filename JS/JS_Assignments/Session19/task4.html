<!DOCTYPE html>
<html>
<head>
    <title>Task 4 - Add Restaurant</title>
</head>
<body>

<h2>Add Restaurant</h2>

<form id="restaurantForm">
    <input type="text" id="name" placeholder="Restaurant Name" required>
    <br><br>

    <input type="text" id="cuisine" placeholder="Cuisine" required>
    <br><br>

    <input type="number" id="rating" placeholder="Rating" step="0.1" min="0" max="5" required>
    <br><br>

    <button type="submit">Add Restaurant</button>
</form>

<script>
const restaurants = [];

document.getElementById("restaurantForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const restaurant = {
        name: document.getElementById("name").value,
        cuisine: document.getElementById("cuisine").value,
        rating: document.getElementById("rating").value
    };

    restaurants.push(restaurant);

    console.log(restaurants);

    this.reset();
});
</script>

</body>
</html>
