<!DOCTYPE html>
<html>
<head>
    <title>Task 6 - Restaurant List</title>
</head>
<body>

<h2>Add Restaurant</h2>

<form id="restaurantForm">
    <input type="text" id="name" placeholder="Restaurant Name" required>
    <input type="text" id="cuisine" placeholder="Cuisine" required>
    <input type="number" id="rating" placeholder="Rating" min="0" max="5" step="0.1" required>

    <button type="submit">Add Restaurant</button>
</form>

<h3>Restaurants</h3>
<div id="restaurantList"></div>

<script>
const restaurants = [];

const form = document.getElementById("restaurantForm");
const restaurantList = document.getElementById("restaurantList");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const restaurant = {
        name: document.getElementById("name").value,
        cuisine: document.getElementById("cuisine").value,
        rating: document.getElementById("rating").value
    };

    restaurants.push(restaurant);

    displayRestaurants();

    form.reset();
});

function displayRestaurants() {
    restaurantList.innerHTML = "";

    restaurants.forEach(function(restaurant, index) {
        const div = document.createElement("div");

        div.innerHTML = `
            <h4>${restaurant.name}</h4>
            <p>Cuisine: ${restaurant.cuisine}</p>
            <p>Rating: ${restaurant.rating}</p>

            <button onclick="editRestaurant(${index})">Edit</button>
            <button onclick="deleteRestaurant(${index})">Delete</button>

            <hr>
        `;

        restaurantList.appendChild(div);
    });
}
</script>

</body>
</html>
