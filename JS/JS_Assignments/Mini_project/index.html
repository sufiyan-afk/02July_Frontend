<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Bio Link Builder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Social Bio Link Builder</h1>

        <p class="subtitle">
            Create and manage your social links
        </p>

        <button id="themeBtn">
            🌙 Dark Mode
        </button>

        <form id="linkForm">

            <input
                type="text"
                id="linkName"
                placeholder="Link Name"
            >

            <input
                type="url"
                id="linkUrl"
                placeholder="https://spotify.com/..."
            >

            <p id="errorMessage"></p>

            <button type="submit">
                Add Link
            </button>

        </form>

        <h2>My Links</h2>

        <div id="linksContainer">
            <!-- Links will appear here -->
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
