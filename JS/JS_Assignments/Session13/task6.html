<!DOCTYPE html>
<html>
<head>
    <title>Task 6</title>
</head>
<body>

<script>
function getOrderTotal(items) {
    let total = 0;

    for (let item of items) {
        if (item.price < 0) {
            throw new Error("Invalid item price");
        }

        total += item.price;
    }

    return total;
}

const items = [
    { name: "Pizza", price: 300 },
    { name: "Burger", price: 200 },
    { name: "Fries", price: -50 }
];

try {
    console.log("Order Total:", getOrderTotal(items));
} catch (error) {
    console.log("Sorry, there was a problem with your order.");
    console.log(error.message);
}
</script>

</body>
</html>
