<script>
function fetchSongLyrics(song, callback) {
    setTimeout(() => {
        const lyrics = `Lyrics for ${song}: This is a sample song lyrics.`;
        callback(lyrics);
    }, 1000);
}

fetchSongLyrics("Perfect", (lyrics) => {
    console.log(lyrics);
});
</script>
