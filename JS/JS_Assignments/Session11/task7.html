<!DOCTYPE html>
<html>
<head>
    <title>Task 7</title>
</head>
<body>

<script>
const products = [
    { name: "iPhone 15", price: 70000 },
    { name: "Samsung Galaxy", price: 50000 },
    { name: "OnePlus 12", price: 60000 },
    { name: "iPhone 14", price: 60000 }
];

function searchProductsCallback(products, searchTerm, callback) {
    setTimeout(() => {
        const result = products.filter(product =>
            product.name.toLowerCase().includes(searchTerm.toLowerCase())
        );

        callback(result);
    }, 1000);
}

function searchProductsPromise(products, searchTerm) {
    return new Promise((resolve) => {
        setTimeout(() => {
            const result = products.filter(product =>
                product.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            resolve(result);
        }, 1000);
    });
}

// Callback version
searchProductsCallback(products, "iPhone", (result) => {
    console.log("Callback result:", result);
});

// Promise version
searchProductsPromise(products, "iPhone")
    .then((result) => {
        console.log("Promise result:", result);
    });
</script>

</body>
</html>
