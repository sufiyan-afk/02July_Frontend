<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Order Tracker</title>

    <style>

        body {
            font-family: Arial;
            margin: 50px;
        }

        li {
            padding: 12px;
            margin: 8px;
            cursor: pointer;
        }

        .favorite {
            font-weight: bold;
            background-color: lightgreen;
        }

        #error {
            color: red;
        }

    </style>

</head>


<body>

    <h1>Restaurant Order Tracker</h1>

    <p id="loading">
        Loading restaurants...
    </p>

    <p id="error"></p>

    <ul id="restaurantList"></ul>


    <script>

        const loading =
            document.getElementById("loading");

        const error =
            document.getElementById("error");

        const restaurantList =
            document.getElementById("restaurantList");


        async function loadRestaurants() {

            try {

                loading.textContent =
                    "Loading restaurants...";


                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );


                if (!response.ok) {

                    throw new Error(
                        "Failed to fetch restaurants"
                    );

                }


                const restaurants =
                    await response.json();


                loading.textContent = "";


                const savedFavorite =
                    localStorage.getItem(
                        "favoriteRestaurant"
                    );


                restaurants.forEach(
                    restaurant => {

                        const li =
                            document.createElement("li");


                        li.textContent =
                            restaurant.name;


                        // Highlight saved favourite
                        if (
                            restaurant.name ===
                            savedFavorite
                        ) {

                            li.classList.add(
                                "favorite"
                            );

                        }


                        li.addEventListener(
                            "click",
                            function() {

                                localStorage.setItem(
                                    "favoriteRestaurant",
                                    restaurant.name
                                );


                                document
                                    .querySelectorAll(
                                        "#restaurantList li"
                                    )
                                    .forEach(item => {

                                        item.classList
                                            .remove(
                                                "favorite"
                                            );

                                    });


                                li.classList.add(
                                    "favorite"
                                );

                            }
                        );


                        restaurantList.appendChild(li);

                    }
                );


            } catch (err) {

                loading.textContent = "";

                error.textContent =
                    "Unable to load restaurants.";

            }

        }


        loadRestaurants();

    </script>

</body>

</html>
