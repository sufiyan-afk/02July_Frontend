<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>AI Original Code</title>

    <style>

        body {
            font-family: Arial;
            margin: 40px;
        }

        li {
            margin: 10px;
            padding: 10px;
        }

        .favorite {
            font-weight: bold;
            background: lightgreen;
        }

        #error {
            color: red;
        }

    </style>

</head>


<body>

    <h1>Food Items</h1>

    <p id="loading">
        Loading...
    </p>

    <p id="error"></p>

    <ul id="foodList"></ul>


<script>

async function loadFoods() {

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    const foodList =
        document.getElementById("foodList");


    try {

        const response =
            await fetch(
                "https://jsonplaceholder.typicode.com/posts"
            );


        const posts =
            await response.json();


        loading.textContent = "";


        posts.forEach(post => {

            const li =
                document.createElement("li");


            li.textContent =
                post.title;


            const button =
                document.createElement("button");


            button.textContent =
                "Add to Favourites";


            button.addEventListener(
                "click",
                function() {

                    let favourites =
                        JSON.parse(
                            localStorage.getItem(
                                "favourites"
                            )
                        ) || [];


                    if (
                        !favourites.includes(
                            post.title
                        )
                    ) {

                        favourites.push(
                            post.title
                        );

                    }


                    localStorage.setItem(
                        "favourites",
                        JSON.stringify(
                            favourites
                        )
                    );


                    li.classList.add(
                        "favorite"
                    );

                }
            );


            li.appendChild(button);

            foodList.appendChild(li);

        });


    }

    catch (err) {

        loading.textContent = "";

        error.textContent =
            "Failed to load food items.";

    }

}


loadFoods();

</script>

</body>

</html>
