<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Delivery Menu App</title>


    <style>

        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }


        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }


        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }


        nav button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }


        .section {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }


        .menu {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
        }


        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }


        .card button {
            padding: 10px;
            cursor: pointer;
        }


        .cart-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
        }


        .hidden {
            display: none;
        }


        #error {
            color: red;
        }

    </style>

</head>


<body>


<header>

    <h1>Food Delivery Menu</h1>

    <p>
        Cart Items:
        <span id="cartCount">0</span>
    </p>

</header>



<!-- Restaurant Selector -->

<section class="section">

    <h2>Restaurants</h2>

    <p id="loading">
        Loading restaurants...
    </p>

    <p id="error"></p>

    <div id="restaurantList"></div>

</section>



<!-- Navigation -->

<nav>

    <button id="browseBtn">
        Browse Menu
    </button>


    <button id="cartBtn">
        View Cart
    </button>


    <button id="clearBtn">
        Clear Cart
    </button>

</nav>



<!-- Browse Menu -->

<section
    id="browseSection"
    class="section"
>

    <h2>Browse Menu</h2>

    <div
        id="menuContainer"
        class="menu"
    ></div>

</section>



<!-- Cart -->

<section
    id="cartSection"
    class="section hidden"
>

    <h2>View Cart</h2>

    <div id="cartContainer"></div>

    <h3>
        Total:
        Rs <span id="cartTotal">0</span>
    </h3>

</section>



<script>


// ==========================
// MENU DATA
// ==========================

const dishes = [

    {
        id: 1,
        name: "Paneer Tikka",
        price: 180,
        category: "Food",
        isVegetarian: true
    },

    {
        id: 2,
        name: "Chicken Biryani",
        price: 250,
        category: "Food",
        isVegetarian: false
    },

    {
        id: 3,
        name: "Veg Burger",
        price: 150,
        category: "Food",
        isVegetarian: true
    },

    {
        id: 4,
        name: "Masala Dosa",
        price: 120,
        category: "Food",
        isVegetarian: true
    },

    {
        id: 5,
        name: "Cold Coffee",
        price: 100,
        category: "Beverage",
        isVegetarian: true
    },

    {
        id: 6,
        name: "Chicken Wings",
        price: 220,
        category: "Food",
        isVegetarian: false
    }

];



// ==========================
// LOAD CART
// ==========================

let cart =
    JSON.parse(
        localStorage.getItem("foodCart")
    ) || [];



// ==========================
// DOM ELEMENTS
// ==========================

const menuContainer =
    document.getElementById(
        "menuContainer"
    );


const cartContainer =
    document.getElementById(
        "cartContainer"
    );


const cartCount =
    document.getElementById(
        "cartCount"
    );


const cartTotal =
    document.getElementById(
        "cartTotal"
    );



// ==========================
// RENDER MENU
// ==========================

function renderMenu() {

    menuContainer.innerHTML = "";


    dishes.forEach(dish => {

        const card =
            document.createElement("div");


        card.className = "card";


        card.innerHTML = `

            <h3>${dish.name}</h3>

            <p>
                Category: ${dish.category}
            </p>

            <p>
                Price: Rs ${dish.price}
            </p>

            <p>
                ${
                    dish.isVegetarian
                    ? "Vegetarian"
                    : "Non-Vegetarian"
                }
            </p>

            <button
                onclick="addToCart(${dish.id})"
            >
                Add to Cart
            </button>

        `;


        menuContainer.appendChild(card);

    });

}



// ==========================
// ADD TO CART
// ==========================

function addToCart(dishId) {

    const dish =
        dishes.find(
            item => item.id === dishId
        );


    const existingItem =
        cart.find(
            item => item.id === dishId
        );


    if (existingItem) {

        existingItem.quantity++;

    }

    else {

        cart.push({

            ...dish,

            quantity: 1

        });

    }


    saveCart();

    renderCart();

}



// ==========================
// SAVE CART
// ==========================

function saveCart() {

    localStorage.setItem(
        "foodCart",
        JSON.stringify(cart)
    );

}



// ==========================
// RENDER CART
// ==========================

function renderCart() {

    cartContainer.innerHTML = "";


    let total = 0;

    let count = 0;


    if (cart.length === 0) {

        cartContainer.innerHTML =
            "<p>Your cart is empty.</p>";

    }


    cart.forEach(item => {

        const itemTotal =
            item.price *
            item.quantity;


        total += itemTotal;

        count += item.quantity;


        const div =
            document.createElement("div");


        div.className =
            "cart-item";


        div.innerHTML = `

            <h3>${item.name}</h3>

            <p>
                Quantity:
                ${item.quantity}
            </p>

            <p>
                Price:
                Rs ${itemTotal}
            </p>

        `;


        cartContainer.appendChild(div);

    });


    cartCount.textContent = count;

    cartTotal.textContent = total;

}



// ==========================
// NAVIGATION
// ==========================

document
    .getElementById("browseBtn")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById(
                    "browseSection"
                )
                .classList.remove("hidden");


            document
                .getElementById(
                    "cartSection"
                )
                .classList.add("hidden");

        }
    );



document
    .getElementById("cartBtn")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById(
                    "browseSection"
                )
                .classList.add("hidden");


            document
                .getElementById(
                    "cartSection"
                )
                .classList.remove("hidden");


            renderCart();

        }
    );



// ==========================
// CLEAR CART
// ==========================

document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        function() {

            cart = [];

            saveCart();

            renderCart();

        }
    );



// ==========================
// FETCH RESTAURANTS
// ==========================

async function loadRestaurants() {

    const loading =
        document.getElementById(
            "loading"
        );


    const error =
        document.getElementById(
            "error"
        );


    const restaurantList =
        document.getElementById(
            "restaurantList"
        );


    try {

        const response =
            await fetch(
                "https://jsonplaceholder.typicode.com/users"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load restaurants"
            );

        }


        const restaurants =
            await response.json();


        loading.textContent = "";


        restaurants.forEach(
            restaurant => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.textContent =
                    restaurant.name;


                button.style.margin =
                    "5px";


                button.addEventListener(
                    "click",
                    function() {

                        alert(
                            `Selected restaurant: ${restaurant.name}`
                        );

                    }
                );


                restaurantList.appendChild(
                    button
                );

            }
        );


    }

    catch (err) {

        loading.textContent = "";

        error.textContent =
            "Unable to load restaurants.";

    }

}



// ==========================
// INITIAL LOAD
// ==========================

renderMenu();

renderCart();

loadRestaurants();


</script>

</body>

</html>
