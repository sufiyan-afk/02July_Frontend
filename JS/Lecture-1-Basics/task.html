<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function findbiggest() {
            let num1 = Number(prompt("enter num1"));
            let num2 = Number(prompt("enter num2"));
            let num3 = Number(prompt("enter num3"));

            let biggest = (num1 > num2) ? ((num1 > num3) ? num1 : num3) : ((num2 > num3) ? num2 : num3);
            alert("biggest number is : " + biggest)
        }
    </script>
</head>
<body>
    <button onclick="findbiggest()">find biggest</button>
</body>
</html>
