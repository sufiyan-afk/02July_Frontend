<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row">

        <div class="col-md-4">
            <div class="card">
                <img src="https://via.placeholder.com/250x200" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Smartphone</h5>
                    <p class="card-text">$499</p>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <img src="https://via.placeholder.com/250x200" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Laptop</h5>
                    <p class="card-text">$899</p>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <img src="https://via.placeholder.com/250x200" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Headphones</h5>
                    <p class="card-text">$99</p>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
