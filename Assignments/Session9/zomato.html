<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row g-4">

        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    <h4>Spice Villa</h4>
                    <p>Best North Indian food with family dining.</p>
                </div>
            </div>
        </div>

        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    <h4>Pizza Hub</h4>
                    <p>Fresh pizzas and cheesy garlic bread.</p>
                </div>
            </div>
        </div>

        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    <h4>Food Palace</h4>
                    <p>Delicious Chinese and Fast Food.</p>
                </div>
            </div>
        </div>

        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    <h4>BBQ Nation</h4>
                    <p>Unlimited buffet with live grill.</p>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
