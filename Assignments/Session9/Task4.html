<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row">

        <div class="col-12 col-md-6 bg-primary text-white p-5">
            <h2>Left Column</h2>
            <p>This column will stack on mobile devices.</p>
        </div>

        <div class="col-12 col-md-6 bg-success text-white p-5">
            <h2>Right Column</h2>
            <p>This column will also stack below on small screens.</p>
        </div>

    </div>
</div>

</body>
</html>
