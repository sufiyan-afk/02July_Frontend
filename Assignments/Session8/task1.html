<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipkart Product Card</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

.card{
    width:700px;
    margin:50px auto;
    display:flex;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    overflow:hidden;
}

.card img{
    width:250px;
    height:250px;
}

.details{
    padding:20px;
}

button{
    background:#2874f0;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="card">

<img src="https://via.placeholder.com/250" alt="Product">

<div class="details">
<h2>Wireless Headphones</h2>
<h3>$99</h3>
<p>Noise cancellation with premium sound quality.</p>

<button>Buy Now</button>

</div>

</div>

</body>
</html>
