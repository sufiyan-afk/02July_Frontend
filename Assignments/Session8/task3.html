<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Breakpoints</title>

<style>

body{
    background:#f3f3f3;
    font-family:Arial;
}

.card{

width:70%;
margin:40px auto;
padding:30px;
background:white;
border:1px solid gray;
font-size:22px;

}

/* Desktop */

@media only screen and (max-width:1200px){

.card{
padding:25px;
font-size:20px;
}

}

/* Tablet */

@media only screen and (max-width:900px){

.card{
padding:20px;
font-size:18px;
}

}

/* Mobile */

@media only screen and (max-width:600px){

.card{
padding:15px;
font-size:16px;
}

}

</style>

</head>

<body>

<div class="card">

<h2>Wireless Earbuds</h2>

<p>Price : $79</p>

<p>Premium Sound Quality</p>

</div>

</body>
</html>
